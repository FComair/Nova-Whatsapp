# Contrôles de sécurité automatiques (RGPD art. 32, docs/37) : dépendances vulnérables à chaque modification et chaque semaine.
# Aucune clé ni secret : les audits ne lisent que composer.lock et package-lock.json.
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  dependances:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Audit Composer (PHP)
        run: |
          docker run --rm -v "$PWD":/app -w /app composer:2 composer audit --locked

      - name: Audit npm (production, niveau élevé et critique)
        run: |
          docker run --rm -v "$PWD":/app -w /app node:24 npm audit --omit=dev --audit-level=high

      - name: Audit npm (outils de développement, critique)
        run: |
          docker run --rm -v "$PWD":/app -w /app node:24 npm audit --audit-level=critical

# Déploiement automatique de Rendivoo sur le VPS Contabo à chaque push sur main.
# Build (Composer + Vite) dans GitHub, archive envoyée par SCP, bascule atomique par lien symbolique.
# Même mécanisme de connexion que le déploiement Rushforless : SSH par mot de passe (appleboy/scp-action, appleboy/ssh-action),
# sans vérification de l'empreinte du serveur (pas de known_hosts).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SSH_HOST      IP du serveur
#   SSH_PORT      port SSH (22 par défaut)
#   SSH_USERNAME  "deploy" (créé par deploy/server-setup.sh ; la connexion root est désactivée)
#   SSH_PASSWORD  mot de passe de l'utilisateur deploy (DEPLOY_PASSWORD du script d'installation)
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /var/www/rendivoo
  KEEP_RELEASES: 5
  HEALTH_URL: https://app.rendivoo.be/up
  SSH_CONNECT_TIMEOUT: 2m

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pgsql, redis, gd
          coverage: none
          tools: composer:v2

      - name: Dépendances PHP (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build des assets (Vite)
        run: |
          npm ci
          npm run build

      # Archive écrite hors du dossier archivé, puis rapatriée : scp-action envoie un chemin relatif au dépôt.
      - name: Archive de la release
        run: |
          tar -czf "$RUNNER_TEMP/release-${GITHUB_SHA}.tar.gz" \
            --exclude=./.git --exclude=./.github --exclude=./.devcontainer --exclude=./.env \
            --exclude=./node_modules --exclude=./tests --exclude=./docker --exclude=./docs \
            --exclude=./storage --exclude='*.local.txt' \
            .
          mv "$RUNNER_TEMP/release-${GITHUB_SHA}.tar.gz" .

      - name: Envoi de la release (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: ${{ env.SSH_CONNECT_TIMEOUT }}
          source: release-${{ github.sha }}.tar.gz
          target: ${{ env.APP_DIR }}/artifacts
          overwrite: true

      - name: Activation de la release
        uses: appleboy/ssh-action@master
        env:
          APP_DIR: ${{ env.APP_DIR }}
          RELEASE: ${{ github.sha }}
          KEEP: ${{ env.KEEP_RELEASES }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: ${{ env.SSH_CONNECT_TIMEOUT }}
          envs: APP_DIR,RELEASE,KEEP
          script: |
            set -euo pipefail
            R="${APP_DIR}/releases/${RELEASE}"
            ARCHIVE="${APP_DIR}/artifacts/release-${RELEASE}.tar.gz"
            mkdir -p "$R"
            tar -xzf "$ARCHIVE" -C "$R"
            rm -f "$ARCHIVE"
            cd "$R"

            # Éléments partagés entre releases : .env et storage
            ln -sfn "${APP_DIR}/shared/.env" "$R/.env"
            rm -rf "$R/storage"
            ln -sfn "${APP_DIR}/shared/storage" "$R/storage"
            mkdir -p "$R/bootstrap/cache"

            # Migrations AVANT la bascule (la release n'est pas encore en ligne), avec le rôle PROPRIÉTAIRE :
            # le rôle applicatif (nova_app) ne peut pas créer de tables (règle du projet : --database=pgsql_owner).
            php artisan migrate --database=pgsql_owner --force
            php artisan storage:link --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Bascule atomique
            ln -sfn "$R" "${APP_DIR}/current_tmp"
            mv -Tf "${APP_DIR}/current_tmp" "${APP_DIR}/current"

            # Recharge PHP (vide OPcache) et redémarre Horizon proprement
            sudo systemctl reload php8.3-fpm
            php artisan horizon:terminate || true
            sudo supervisorctl start rendivoo-horizon || true

            # Ne garde que les N dernières releases
            cd "${APP_DIR}/releases"
            ls -1dt */ | tail -n +$((KEEP + 1)) | xargs -r rm -rf

      - name: Vérification de santé
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Le site ne répond pas correctement après déploiement." >&2
          exit 1

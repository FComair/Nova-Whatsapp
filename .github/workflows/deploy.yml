# Déploiement automatique de Rendivoo sur le VPS Contabo à chaque push sur main.
# Build (Composer + Vite) dans GitHub, envoi par rsync, bascule atomique par lien symbolique.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   DEPLOY_HOST         IP ou nom du serveur (ex. app.rendivoo.be)
#   DEPLOY_USER         "deploy"
#   DEPLOY_SSH_KEY      clé PRIVÉE dédiée au déploiement (la publique est sur le serveur)
#   DEPLOY_KNOWN_HOSTS  sortie de : ssh-keyscan -t ed25519 <DEPLOY_HOST>
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /var/www/rendivoo
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pgsql, redis, gd
          coverage: none
          tools: composer:v2

      - name: Dépendances PHP (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build des assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Clé SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoi de la release (rsync)
        run: |
          RELEASE="${APP_DIR}/releases/${GITHUB_SHA}"
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${RELEASE}"
          rsync -az --delete -e "$SSH" \
            --exclude='.git' --exclude='.github' --exclude='.devcontainer' --exclude='.env' \
            --exclude='node_modules' --exclude='tests' --exclude='docker' --exclude='docs' \
            --exclude='storage' --exclude='*.local.txt' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${RELEASE}/"

      - name: Activation de la release
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "APP_DIR=${APP_DIR} RELEASE=${GITHUB_SHA} KEEP=${KEEP_RELEASES} bash -s" <<'REMOTE'
          set -euo pipefail
          R="${APP_DIR}/releases/${RELEASE}"
          cd "$R"

          # Éléments partagés entre releases : .env et storage
          ln -sfn "${APP_DIR}/shared/.env" "$R/.env"
          rm -rf "$R/storage"
          ln -sfn "${APP_DIR}/shared/storage" "$R/storage"
          mkdir -p "$R/bootstrap/cache"

          # Migrations AVANT la bascule (la release n'est pas encore en ligne)
          php artisan migrate --force
          php artisan storage:link --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          # Bascule atomique
          ln -sfn "$R" "${APP_DIR}/current_tmp"
          mv -Tf "${APP_DIR}/current_tmp" "${APP_DIR}/current"

          # Recharge PHP (vide OPcache) et redémarre Horizon proprement
          sudo systemctl reload php8.3-fpm
          php artisan horizon:terminate || true
          sudo supervisorctl start rendivoo-horizon || true

          # Ne garde que les N dernières releases
          cd "${APP_DIR}/releases"
          ls -1dt */ | tail -n +$((KEEP + 1)) | xargs -r rm -rf
          REMOTE

      - name: Vérification de santé
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://app.rendivoo.be/up" || true)
            echo "Tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Le site ne répond pas correctement après déploiement." >&2
          exit 1
